# The TVPort Mac app. xcodegen generate, then build the TVPort scheme.
name: TVPort
options:
  bundleIdPrefix: dev.tvport
  deploymentTarget:
    macOS: "14.0"
targets:
  TVPort:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TVPort
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "44"
        CFBundleURLTypes:
          - CFBundleURLName: dev.tvport.mac.build
            CFBundleURLSchemes: [tvport]
        LSApplicationCategoryType: public.app-category.utilities
        TVPortRoot: $(SRCROOT)/../..   # where backend.py and the engine are; the app is not sandboxed because it runs Xcode's tools
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: TVPortIcon
      PRODUCT_BUNDLE_IDENTIFIER: dev.tvport.mac
      SWIFT_VERSION: "5.0"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: NO
      GENERATE_INFOPLIST_FILE: NO
      MACOSX_DEPLOYMENT_TARGET: "14.0"
